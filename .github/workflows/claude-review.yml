name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: PR 자동 리뷰 (PR 생성/업데이트 시)
  # ─────────────────────────────────────────────
  auto-review:
    if: "github.event_name == 'pull_request' && github.event.pull_request.draft == false"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 15 --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(wc:*),mcp__github_inline_comment__create_inline_comment"'
          prompt: |
            You are a code reviewer for the ccbuilder project — a Claude Code extension/skill builder.

            ## PR Info
            - Repository: ${{ github.repository }}
            - PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            - Author: ${{ github.event.pull_request.user.login }}
            - Base: ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}

            ## Review Instructions

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to see all changes
            2. Review the code focusing on:

            ### Code Quality
            - Clean, readable code with meaningful names
            - No commented-out code or debug statements
            - DRY principle — no unnecessary duplication

            ### Correctness
            - Logic errors or edge cases
            - Missing error handling
            - Incorrect regex or string manipulation

            ### Security
            - Hardcoded secrets or credentials
            - Command injection in shell scripts
            - Unsafe file operations

            ### Project-Specific (ccbuilder)
            - SKILL.md must stay under 500 lines
            - Version format follows Semantic Versioning
            - Korean content style consistency
            - CHANGELOG.md follows Keep a Changelog format
            - releases/ directory has proper backup naming (v{VERSION}_{DATE}_SKILL.md)

            ## Output Format

            Use `mcp__github_inline_comment__create_inline_comment` for line-specific issues.
            After reviewing all files, post a summary comment using `gh pr comment` with:

            ```
            ## 🔍 Claude Code Review

            ### Summary
            [1-2 sentence overall assessment]

            ### Findings
            | Severity | File | Issue |
            |----------|------|-------|
            | 🔴 Critical | ... | ... |
            | 🟡 Warning | ... | ... |
            | 🔵 Suggestion | ... | ... |

            ### Verdict
            ✅ LGTM / ⚠️ Changes Requested / 🔴 Blocking Issues
            ```

            If everything looks good with no issues, keep the summary brief.

  # ─────────────────────────────────────────────
  # Job 2: @claude 멘션 응답 (코멘트에서 트리거)
  # ─────────────────────────────────────────────
  mention-response:
    if: "(github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: '--max-turns 20 --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(wc:*),mcp__github_inline_comment__create_inline_comment"'
