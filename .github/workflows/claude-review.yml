name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: PR 자동 리뷰 (PR 생성/업데이트 시)
  # ─────────────────────────────────────────────
  auto-review:
    if: "github.event_name == 'pull_request' && github.event.pull_request.draft == false"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 15 --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(wc:*),mcp__github_inline_comment__create_inline_comment"'
          prompt: |
            You are a code reviewer for the ccbuilder project.

            **IMPORTANT**: Read `CLAUDE.md` first — it contains project structure, version management rules, and review criteria.

            ## PR Info
            - Repository: ${{ github.repository }}
            - PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            - Author: ${{ github.event.pull_request.user.login }}
            - Base: ${{ github.event.pull_request.base.ref }} ← ${{ github.event.pull_request.head.ref }}

            ## Review Steps

            1. Read `CLAUDE.md` for project context and review criteria
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to see all changes
            3. Review focusing on:
               - **Code Quality**: clean code, no debug statements, DRY
               - **Correctness**: logic errors, edge cases, regex issues
               - **Security**: hardcoded secrets, command injection, unsafe file ops
               - **Project Rules** (from CLAUDE.md): SKILL.md 500줄 제한, Semantic Versioning, CHANGELOG 형식, releases/ 백업, 파일 간 버전/이벤트 수 일관성
            4. Use `mcp__github_inline_comment__create_inline_comment` for line-specific issues
            5. Post summary via `gh pr comment` with this format:

            ```
            ## 🔍 Claude Code Review

            ### Summary
            [1-2 sentence assessment]

            ### Findings
            | Severity | File | Issue |
            |----------|------|-------|
            | 🔴 Critical / 🟡 Warning / 🔵 Suggestion | file | description |

            ### Verdict
            ✅ LGTM / ⚠️ Changes Requested / 🔴 Blocking Issues
            ```

  # ─────────────────────────────────────────────
  # Job 2: @claude 멘션 응답 (코멘트에서 트리거)
  # ─────────────────────────────────────────────
  mention-response:
    if: "(github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: '--max-turns 20 --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(wc:*),mcp__github_inline_comment__create_inline_comment"'
