name: Auto Version Sync

on:
  schedule:
    # 매일 오전 9시 UTC (한국시간 오후 6시) 실행
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force update even if version matches"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      current_version: ${{ steps.check.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Claude Code version update
        id: check
        run: |
          # 현재 SKILL.md에서 지원 버전 추출
          CURRENT=$(grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" skills/ccbuilder/SKILL.md | head -1 || echo "unknown")
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"

          # 공식 CHANGELOG에서 최신 버전 추출
          CHANGELOG=$(curl -s https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md)
          LATEST=$(echo "$CHANGELOG" | grep -m1 "^## [0-9]" | sed 's/## //' | tr -d ' ')
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"

          CURRENT_CLEAN=$(echo "$CURRENT" | sed 's/v//')
          LATEST_CLEAN=$(echo "$LATEST" | sed 's/v//')

          if [ "$CURRENT_CLEAN" != "$LATEST_CLEAN" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "🔄 Update needed: $CURRENT → v$LATEST"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already up to date: $CURRENT"
          fi

  update-version:
    needs: check-version
    if: needs.check-version.outputs.update_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update version references
        env:
          OLD_VERSION: ${{ needs.check-version.outputs.current_version }}
          NEW_VERSION: v${{ needs.check-version.outputs.latest_version }}
        run: |
          OLD_CLEAN=$(echo "$OLD_VERSION" | sed 's/^v//')
          NEW_CLEAN=$(echo "$NEW_VERSION" | sed 's/^v//')
          TODAY=$(date +%Y-%m-%d)

          # skills/ccbuilder/SKILL.md
          sed -i "s/\*\*Version\*\*: ${OLD_CLEAN}/**Version**: ${NEW_CLEAN}/" skills/ccbuilder/SKILL.md
          sed -i "s/\*\*Last Updated\*\*: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/**Last Updated**: ${TODAY}/" skills/ccbuilder/SKILL.md
          sed -i "s/v${OLD_CLEAN}/v${NEW_CLEAN}/g" skills/ccbuilder/SKILL.md
          # Footer status line
          sed -i "s/| \*\*Claude Code\*\*: v[0-9.]*+/| **Claude Code**: v${NEW_CLEAN}+/" skills/ccbuilder/SKILL.md
          sed -i "s/| \*\*Sync\*\*: .*/| **Sync**: [version-sync.md](references\/version-sync.md) | [check-updates.sh](..\/..\/scripts\/check-updates.sh)/" skills/ccbuilder/SKILL.md

          # .claude-plugin/plugin.json
          if [ -f .claude-plugin/plugin.json ]; then
            sed -i "s/\"version\": \"${OLD_CLEAN}\"/\"version\": \"${NEW_CLEAN}\"/" .claude-plugin/plugin.json
          fi

          # .claude-plugin/marketplace.json
          if [ -f .claude-plugin/marketplace.json ]; then
            sed -i "s/\"version\": \"${OLD_CLEAN}\"/\"version\": \"${NEW_CLEAN}\"/" .claude-plugin/marketplace.json
          fi

          # README.md version badge
          if [ -f README.md ]; then
            sed -i "s/v${OLD_CLEAN}/v${NEW_CLEAN}/g" README.md
          fi

          # CHANGELOG.md - prepend new entry after first heading
          if [ -f CHANGELOG.md ]; then
            ENTRY="\n## [${NEW_CLEAN}] - ${TODAY}\n\n### Changed\n- Claude Code compatibility updated to v${NEW_CLEAN}\n"
            sed -i "0,/^## \[/s/^## \[/${ENTRY}\n## [/" CHANGELOG.md
          fi

          echo "✅ Version updated: ${OLD_VERSION} → ${NEW_VERSION}"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ needs.check-version.outputs.current_version }}
          NEW_VERSION: v${{ needs.check-version.outputs.latest_version }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="chore/sync-cc-${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A

          # Capture diff before committing
          DIFF_STAT=$(git diff --cached --stat)
          DIFF_DETAIL=$(git diff --cached -- '*.md' '*.json' | head -200)

          git commit -m "chore: sync Claude Code ${NEW_VERSION}"
          git push -u origin "$BRANCH"

          # Write PR body to a temp file to avoid shell quoting issues
          cat > /tmp/pr-body.md <<PREOF
          ## Summary

          Claude Code 호환 버전을 **${OLD_VERSION}** → **${NEW_VERSION}** 으로 업데이트합니다.

          > Auto-generated by [version sync workflow](https://github.com/${REPO}/actions/runs/${RUN_ID})

          ## Changes

          ### Version Update: \`${OLD_VERSION}\` → \`${NEW_VERSION}\`

          | File | Description |
          |------|-------------|
          | \`skills/ccbuilder/SKILL.md\` | Version, Last Updated, compatibility range |
          | \`.claude-plugin/plugin.json\` | Plugin version field |
          | \`.claude-plugin/marketplace.json\` | Marketplace version field |
          | \`README.md\` | Version badge / references |
          | \`CHANGELOG.md\` | New changelog entry added |

          ### Changed Files

          \`\`\`
          ${DIFF_STAT}
          \`\`\`

          ### Diff Detail

          \`\`\`diff
          ${DIFF_DETAIL}
          \`\`\`
          PREOF

          # Remove leading whitespace from heredoc (caused by YAML indentation)
          sed -i 's/^          //' /tmp/pr-body.md

          gh pr create \
            --title "chore: sync Claude Code ${NEW_VERSION}" \
            --body-file /tmp/pr-body.md
