name: Auto Version Sync

on:
  schedule:
    # 매일 오전 9시 UTC (한국시간 오후 6시) 실행
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force update even if version matches"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      current_version: ${{ steps.check.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Claude Code version update
        id: check
        run: |
          # 현재 SKILL.md에서 지원 버전 추출
          CURRENT=$(grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" skills/ccbuilder/SKILL.md | head -1 || echo "unknown")
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"

          # 공식 CHANGELOG에서 최신 버전 추출
          CHANGELOG=$(curl -s https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md)
          LATEST=$(echo "$CHANGELOG" | grep -m1 "^## [0-9]" | sed 's/## //' | tr -d ' ')
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"

          CURRENT_CLEAN=$(echo "$CURRENT" | sed 's/v//')
          LATEST_CLEAN=$(echo "$LATEST" | sed 's/v//')

          if [ "$CURRENT_CLEAN" != "$LATEST_CLEAN" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "🔄 Update needed: $CURRENT → v$LATEST"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already up to date: $CURRENT"
          fi

  update-with-claude:
    needs: check-version
    if: needs.check-version.outputs.update_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude Code for version sync
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Update version references from ${{ needs.check-version.outputs.current_version }} to v${{ needs.check-version.outputs.latest_version }}.

            Do these steps in order. Use parallel tool calls where possible.

            Step 1: Update version strings in these files (use Edit tool, not Bash):
            - skills/ccbuilder/SKILL.md: version header and Claude Code compatibility version
            - .claude-plugin/plugin.json: version field
            - .claude-plugin/marketplace.json: version field
            - README.md: version badge

            Step 2: Add a new entry to CHANGELOG.md for the version update.

            Step 3: Create a git commit with message "chore: sync Claude Code v${{ needs.check-version.outputs.latest_version }}" and push to a new branch "chore/sync-cc-${{ needs.check-version.outputs.latest_version }}".

            Step 4: Create a PR with title "chore: sync Claude Code v${{ needs.check-version.outputs.latest_version }}" using gh pr create.

            IMPORTANT: Only work within the repository directory. Do not explore .claude or home directories.
          claude_args: "--max-turns 30"
