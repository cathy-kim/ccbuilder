name: Auto Version Sync

on:
  schedule:
    # 매일 오전 9시 UTC (한국시간 오후 6시) 실행
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force update even if version matches"
        required: false
        default: "false"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      current_version: ${{ steps.check.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Claude Code version update
        id: check
        run: |
          # 현재 SKILL.md에서 지원 버전 추출
          CURRENT=$(grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" skills/ccbuilder/SKILL.md | head -1 || echo "unknown")
          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"

          # 공식 CHANGELOG에서 최신 버전 추출
          CHANGELOG=$(curl -s https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md)
          LATEST=$(echo "$CHANGELOG" | grep -m1 "^## [0-9]" | sed 's/## //' | tr -d ' ')
          echo "latest_version=$LATEST" >> "$GITHUB_OUTPUT"

          CURRENT_CLEAN=$(echo "$CURRENT" | sed 's/v//')
          LATEST_CLEAN=$(echo "$LATEST" | sed 's/v//')

          if [ "$CURRENT_CLEAN" != "$LATEST_CLEAN" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "update_needed=true" >> "$GITHUB_OUTPUT"
            echo "🔄 Update needed: $CURRENT → v$LATEST"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already up to date: $CURRENT"
          fi

  update-with-claude:
    needs: check-version
    if: needs.check-version.outputs.update_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Claude Code for version sync
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Claude Code의 새 버전이 감지되었습니다.
            - 현재 버전: ${{ needs.check-version.outputs.current_version }}
            - 최신 버전: ${{ needs.check-version.outputs.latest_version }}

            다음 작업을 수행해주세요:

            1. 공식 CHANGELOG 확인:
               curl -s https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md 에서
               현재 버전 이후의 변경사항을 분석해주세요.

            2. 다음 파일들의 버전 참조를 업데이트해주세요:
               - skills/ccbuilder/SKILL.md: 버전 헤더와 Claude Code 호환 버전
               - .claude-plugin/plugin.json: version 필드
               - .claude-plugin/marketplace.json: version 필드
               - README.md: version 뱃지

            3. CHANGELOG.md에 새 버전 엔트리를 추가해주세요:
               - Claude Code 호환 버전 업데이트 내용
               - 새로 추가된 기능이 있으면 반영
               - Breaking changes가 있으면 마이그레이션 가이드 포함

            4. 레퍼런스 문서 중 변경이 필요한 것이 있으면 업데이트해주세요:
               - references/skills-guide.md
               - references/hooks-guide.md
               - references/subagents-guide.md

            5. releases/ 폴더에 현재 SKILL.md 백업을 생성해주세요.

            모든 변경사항을 커밋하고 PR을 생성해주세요.
            PR 제목: "chore: sync Claude Code ${{ needs.check-version.outputs.latest_version }}"
          claude_args: "--max-turns 20"
